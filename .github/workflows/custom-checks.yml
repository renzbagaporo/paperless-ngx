name: Custom feature checks
on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test release publication policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_personal_release.py' -v
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    container:
      image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
      options: --user 0
    services:
      redis:
        image: valkey/valkey:9.1.2-alpine
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: paperless
          POSTGRES_DB: paperless_ci
        options: >-
          --health-cmd "pg_isready -U paperless -d paperless_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOME: /tmp/paperless-custom-home
      PAPERLESS_SECRET_KEY: isolated-test-only-key
      PAPERLESS_DATA_DIR: /tmp/paperless-custom-data
      PAPERLESS_MEDIA_ROOT: /tmp/paperless-custom-media
      PAPERLESS_SCRATCH_DIR: /tmp/paperless-custom-scratch
      PAPERLESS_CONSUMPTION_DIR: /tmp/paperless-custom-consume
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: ${{ matrix.database == 'postgres' && 'postgresql' || 'sqlite' }}
      PAPERLESS_DBHOST: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBNAME: paperless_ci
      PNGX_CONTAINERIZED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          mkdir -p "$HOME" "$PAPERLESS_DATA_DIR" "$PAPERLESS_MEDIA_ROOT" "$PAPERLESS_SCRATCH_DIR" "$PAPERLESS_CONSUMPTION_DIR"
          uv pip install --system --no-cache --group testing 'ruff~=0.16.1'
      - name: Check Python formatting and lint
        run: |
          ruff check --no-fix src
          ruff format --check src
      - name: Test document updates and OCR
        if: matrix.database == 'sqlite'
        run: |
          chown -R paperless:paperless \
            "$HOME" "$PAPERLESS_DATA_DIR" "$PAPERLESS_MEDIA_ROOT" \
            "$PAPERLESS_SCRATCH_DIR" "$PAPERLESS_CONSUMPTION_DIR"
          runuser --preserve-environment --user paperless -- \
            pytest -o addopts='' -o cache_dir="$HOME/.cache/pytest" \
            --basetemp=/tmp/paperless-custom-pytest \
            src/documents/tests/test_file_updates.py \
            src/documents/tests/test_pdf_editor_updates.py \
            src/documents/tests/test_ingestion_checks.py \
            src/documents/tests/test_remote_ocr_resilience.py \
            src/documents/tests/test_deferred_ingestion.py \
            src/documents/tests/test_ocr_status.py \
            src/documents/tests/test_ocr_recovery.py \
            src/documents/tests/test_ocr_index.py \
            src/documents/tests/test_ocr_storage_policy.py \
            src/documents/tests/test_ocr_interactions.py \
            src/documents/tests/test_ocr_lifecycle_transactions.py \
            src/documents/tests/test_ocr_review_regressions.py \
            src/documents/tests/test_file_cleanup_recovery.py \
            src/documents/tests/test_storage_review_regressions.py \
            src/documents/tests/test_deferred_metadata_concurrency.py \
            src/documents/tests/test_ocr_adversarial_regressions.py \
            src/documents/tests/test_ocr_index_adversarial.py \
            src/documents/tests/test_paid_ocr_recovery.py \
            src/documents/tests/test_paid_reprocess_recovery.py \
            src/documents/tests/test_layout_orientation.py \
            src/documents/tests/test_legacy_image_reprocess.py \
            src/documents/tests/test_initial_image_archive_policy.py \
            src/documents/tests/test_index_ingestion_publication.py \
            src/documents/tests/test_automatic_compaction.py \
            src/documents/tests/test_root_reprocess_concurrency.py \
            src/documents/tests/test_never_ocr_retry.py \
            src/documents/tests/test_provider_numeric_validation.py \
            src/documents/tests/test_source_pdf_text_boundary.py \
            src/documents/tests/test_ocr_index_concurrency.py \
            src/documents/tests/test_ocr_index_write_fence.py \
            src/documents/tests/test_page_data.py \
            src/documents/tests/test_tasks.py \
            src/documents/tests/test_consumer.py \
            src/documents/tests/test_bulk_edit.py \
            src/documents/tests/test_api_bulk_edit.py \
            src/documents/tests/test_api_document_versions.py \
            src/documents/tests/test_document_list_effective_content_annotation.py \
            src/documents/tests/test_api_remote_version.py \
            src/documents/tests/test_merge_documents_as_versions.py \
            src/documents/tests/test_version_conditionals.py \
            src/documents/tests/test_task_signals.py \
            src/documents/tests/test_api_tasks.py \
            src/documents/tests/test_api_uisettings.py \
            src/documents/tests/test_api_status.py::TestSystemStatus::test_system_status_exposes_personal_display_and_upstream_versions \
            src/paperless/tests/parsers/test_llamaparse_parser.py \
            src/paperless/tests/parsers/test_remote_parser.py \
            src/paperless/tests/test_registry.py \
            src/paperless/tests/test_remote_ocr_config.py \
            src/paperless/tests/settings/test_custom_parsers.py \
            src/paperless/tests/test_personal_version.py
      - name: Test native import and export in a separate process
        if: matrix.database == 'sqlite'
        # The CLI importer disables process-global audit receivers for its import.
        run: |
          runuser --preserve-environment --user paperless -- \
            pytest -o addopts='' -o cache_dir="$HOME/.cache/pytest-native" \
            --basetemp=/tmp/paperless-custom-native-pytest \
            src/documents/tests/test_management_exporter.py \
            src/documents/tests/test_management_importer.py
      - name: Test PostgreSQL transactions and OCR recovery
        if: matrix.database == 'postgres'
        run: |
          chown -R paperless:paperless \
            "$HOME" "$PAPERLESS_DATA_DIR" "$PAPERLESS_MEDIA_ROOT" \
            "$PAPERLESS_SCRATCH_DIR" "$PAPERLESS_CONSUMPTION_DIR"
          runuser --preserve-environment --user paperless -- \
            pytest -o addopts='' -o cache_dir="$HOME/.cache/pytest" \
            --basetemp=/tmp/paperless-custom-pytest \
            src/documents/tests/test_file_cleanup_recovery.py \
            src/documents/tests/test_storage_review_regressions.py \
            src/documents/tests/test_deferred_metadata_concurrency.py \
            src/documents/tests/test_ocr_adversarial_regressions.py \
            src/documents/tests/test_ocr_index_adversarial.py \
            src/documents/tests/test_paid_ocr_recovery.py \
            src/documents/tests/test_paid_reprocess_recovery.py \
            src/documents/tests/test_layout_orientation.py \
            src/documents/tests/test_legacy_image_reprocess.py \
            src/documents/tests/test_initial_image_archive_policy.py \
            src/documents/tests/test_index_ingestion_publication.py \
            src/documents/tests/test_automatic_compaction.py \
            src/documents/tests/test_root_reprocess_concurrency.py \
            src/documents/tests/test_never_ocr_retry.py \
            src/documents/tests/test_provider_numeric_validation.py \
            src/documents/tests/test_source_pdf_text_boundary.py \
            src/documents/tests/test_ocr_index_concurrency.py \
            src/documents/tests/test_ocr_index_write_fence.py \
            src/documents/tests/test_ocr_review_regressions.py \
            src/documents/tests/test_ocr_lifecycle_transactions.py \
            src/documents/tests/test_remote_ocr_resilience.py \
            src/documents/tests/test_deferred_ingestion.py \
            src/documents/tests/test_ocr_recovery.py \
            src/documents/tests/test_ocr_index.py \
            src/documents/tests/test_ocr_storage_policy.py \
            src/documents/tests/test_ocr_interactions.py
      - name: Check migrations
        run: python3 src/manage.py makemigrations --check --dry-run
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: src-ui/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test document file controls
        run: |
          pnpm exec jest --runInBand --runTestsByPath \
            src/app/components/common/pdf-editor/pdf-editor.component.spec.ts \
            src/app/components/document-detail/document-version-dropdown/document-version-dropdown.component.spec.ts \
            src/app/components/document-detail/document-detail.component.spec.ts \
            src/app/services/rest/document.service.spec.ts \
            src/app/components/admin/config/config.component.spec.ts \
            src/app/components/app-frame/app-frame.component.spec.ts \
            src/app/components/common/system-status-dialog/system-status-dialog.component.spec.ts
      - run: pnpm exec ng build --configuration production
