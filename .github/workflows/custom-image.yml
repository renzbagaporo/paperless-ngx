name: Build custom image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built image to this fork's GHCR repository
        type: boolean
        default: false
      revision:
        description: Source branch, tag or commit (empty uses the selected workflow revision)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/${{ github.repository }}:personal
            ghcr.io/${{ github.repository }}:personal-${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
