name: Publish personal release image
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: personal-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'renzbagaporo/paperless-ngx' && startsWith(github.event.release.tag_name, 'personal-v') && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ancestry, version and CI
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/personal_release.py
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.custom
          push: true
          tags: |
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.tag }}
            ${{ needs.verify.outputs.image }}:personal-${{ needs.verify.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
          cache-from: type=gha,scope=personal-release
          cache-to: type=gha,scope=personal-release,mode=max
